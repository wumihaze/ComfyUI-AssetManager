name: checks

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  policy:
    name: Registry policy + tests (${{ matrix.os }})
    # 两边都跑: Linux 能测出软链/路径分隔符类问题, Windows 是插件的实际运行环境,
    # 只跑一边就有一半的平台差异看不到。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install "Pillow>=9.0" "av>=10.0.0" aiohttp

      - name: Registry policy self-check
        run: python tools/policy_check.py
