version = "1.0.0"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Wumihaze", email = "317549200+wumihaze@users.noreply.github.com" }]
keywords = ["comfyui", "asset-manager", "gallery", "archive", "backup"]
requires-python = ">=3.9"
dependencies = ["Pillow>=9.0"]

[project.urls]
Repository = "https://github.com/Wumihaze/ComfyUI-AssetManager"

[tool.comfy]
PublisherId = "wumihaze"
DisplayName = "ComfyUI-AssetManager"
